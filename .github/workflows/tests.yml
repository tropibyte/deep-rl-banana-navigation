name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # No Unity binary in CI: these cover the agent, networks, replay buffers
      # and configs, none of which touch the environment.
      - name: Run tests
        env:
          OMP_NUM_THREADS: "1"
          BANANA_TORCH_THREADS: "1"
        run: pytest tests/ -q
