# Baseline: vanilla DQN (Mnih et al. 2015). Every ablation is measured against this.
name: dqn
agent:
  double: false
  dueling: false
  prioritized: false
  noisy: false
  n_step: 1
  hidden: [128, 64]
  buffer_size: 100000
  batch_size: 64
  gamma: 0.99
  lr: 0.0005
  tau: 0.001
  update_every: 4
  learn_starts: 1000
train:
  n_episodes: 2000
  eps_start: 1.0
  eps_end: 0.01
  eps_decay: 0.995
  print_every: 50
