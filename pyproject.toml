[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-nav"
version = "1.0.0"
description = "Rainbow-style value-based agents for the Unity ML-Agents Banana Collector environment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "imageio>=2.31",
    # Pinned: the vendored ml-agents v0.4 protobuf stubs were generated by
    # protoc 3.5 and are rejected by the protobuf >=4.21 runtime.
    "protobuf==3.20.3",
    "grpcio>=1.60",
]

[project.scripts]
banana-train = "banana_nav.cli:main"

[tool.setuptools]
# banana_nav is ours; unityagents/communicator_objects are the vendored,
# modernised Unity ML-Agents v0.4 client (see docs/PORTING.md).
packages = ["banana_nav", "unityagents", "communicator_objects"]

[tool.setuptools.package-dir]
banana_nav = "src/banana_nav"
unityagents = "vendor/unityagents"
communicator_objects = "vendor/communicator_objects"
